[package]
name = "skarbiec"
version = "0.1.0"
description = "Skarbiec: domowy portfel inwestycyjny"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519).
name = "skarbiec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
