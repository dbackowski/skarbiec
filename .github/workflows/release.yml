name: Release

# Builds the app for macOS, Windows and Linux into one GitHub Release, created as a draft and
# published automatically once all three platforms succeed (on any failure it stays a draft).
# Run it by pushing a tag matching the app version (git tag v1.0.0 && git push origin v1.0.0)
# or manually from the Actions tab ("Run workflow"); the release is named after the version
# in src-tauri/tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload files

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # One draft release created up front: parallel build jobs creating it themselves would race
  # and could produce duplicate drafts.
  create-release:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${version} (expected v${version})"
            exit 1
          fi

      - name: Create draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { version } = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `Skarbiec v${version}`,
              draft: true,
              body: [
                `Skarbiec v${version} for macOS (Apple Silicon), Windows and Linux.`,
                "",
                "The app is not code-signed, so the system warns on first launch:",
                "- macOS: after copying it to Applications, right-click Skarbiec.app → Open → Open,",
                "  or in Terminal: `xattr -dr com.apple.quarantine /Applications/Skarbiec.app`",
                "- Windows: in the SmartScreen dialog choose More info → Run anyway.",
                "- Linux: install the .deb or .rpm, or make the AppImage executable (`chmod +x`) and run it.",
              ].join("\n"),
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false # one platform failing should not cancel the others
      matrix:
        include:
          - platform: macos-latest # Apple Silicon: .dmg, .app
          - platform: windows-latest # .msi, .exe (NSIS)
          - platform: ubuntu-22.04 # .AppImage, .deb, .rpm; older glibc so the AppImage runs on more distros
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # Runs only when every platform built and uploaded successfully; otherwise the release stays
  # a draft, so an incomplete release is never public.
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
