name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml before building packages

jobs:
  tests:
    # Linux: cheapest runner; the tests do not depend on macOS (UI tests run in Chrome).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: JS tests (unit and UI in Chrome)
        run: npm test

      # Tauri needs WebKitGTK and friends to compile on Linux.
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: npm run test:rust
